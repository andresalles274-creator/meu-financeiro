name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: meu-financeiro-debug-keystore-v1
      - name: Ensure signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Meu Financeiro,OU=Andre22,O=Andre22,L=Juiz de Fora,ST=MG,C=BR"
          fi
      - run: cd android && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Meu-Financeiro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
