<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050706">
<link rel="manifest" href="manifest.json?v=5">
<link rel="icon" href="icon.svg?v=1">
<link rel="apple-touch-icon" href="icon.svg?v=1">
<title>Meu Financeiro</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#050706;color:#f5f7f5;font-family:system-ui,-apple-system,sans-serif}
main{max-width:520px;margin:auto;padding:48px 16px 90px}
.ey{color:#43f56f;font-size:12px;letter-spacing:.18em;font-weight:800}
h1{margin:5px 0 2px;font-size:30px}
.sub,.label{color:#8c958f}
.sub{margin:0 0 20px}\n.header{margin-bottom:20px}.balanceLine{display:flex;align-items:center}.balanceLine .balance{margin-right:0}.brandLogo{width:72px;height:72px;margin-left:54px;flex:0 0 72px;border-radius:50%;filter:drop-shadow(0 0 7px #20ff5a66)}@media(max-width:380px){.brandLogo{width:62px;height:62px;flex-basis:62px;margin-left:34px}}
.card,.metric,.day{background:#0c100e;border:1px solid #1b2420;border-radius:22px;padding:18px;box-shadow:0 14px 40px #0008}
.label{font-size:13px}
.balance{font-size:38px;font-weight:800;margin:6px 0}
.green{color:#43f56f}
.red{color:#ff4d5e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.metric b{display:block;font-size:20px;margin-top:6px}
.today{margin:18px 0}
.row{display:flex;justify-content:space-between;gap:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
button{border:0;border-radius:16px;padding:15px;font-weight:800;background:#43f56f;color:#041006}
button.exp{background:#181d1a;color:#ff6674;border:1px solid #3a2025}
.form{display:none;margin:14px 0}
.form.on{display:block}
input,select{width:100%;background:#0a0e0c;border:1px solid #27302b;color:white;border-radius:14px;padding:14px;margin:5px 0}
.save{width:100%;margin-top:7px}
.sync{font-size:12px;color:#87918a;margin-top:9px}
.day{margin:10px 0}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border-top:1px solid #1b221e;padding:12px 0}.tx>div:last-child{text-align:right;min-width:132px}.tx>div:last-child>div{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.tx:first-of-type{border-top:0}
.tx small{display:block;color:#818b84}
.tx button{padding:9px 11px;background:#151a17;color:#aab3ad;font-size:11px;margin:0;min-width:58px}@media(max-width:390px){.tx{grid-template-columns:1fr}.tx>div:last-child{text-align:left;min-width:0}.tx>div:last-child>div{justify-content:flex-start}.tx button{min-width:72px}}
.empty{text-align:center;color:#78827b;padding:30px 0}
.danger{background:#5b171d!important;color:#fff!important;border-color:#ff3045!important}</style>
</head>

<body>
<main>

<div class="ey">CONTROLE DIÁRIO</div>
<h1>Meu Financeiro</h1>


<section class="card">
<div class="label">Saldo geral</div>
<div class="balanceLine"><div class="balance" id="saldo">R$ 0,00</div><img class="brandLogo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23050706' stroke='%2335f56a' stroke-width='5'/%3E%3Crect x='24' y='37' width='8' height='25' fill='%23ff3045'/%3E%3Crect x='69' y='29' width='8' height='31' fill='%2335f56a'/%3E%3Ctext x='50' y='70' text-anchor='middle' font-family='Arial' font-size='58' font-weight='900' fill='%2335f56a'%3E%24%3C/text%3E%3C/svg%3E" alt="Logo Meu Financeiro"></div>
<div class="label">Desde o primeiro lançamento</div>
<div class="sync" id="sync">Sincronizando…</div>
</section>

<div class="grid">
<div class="metric">
<span class="label">Total que entrou</span>
<b class="green" id="tin">R$ 0,00</b>
</div>

<div class="metric">
<span class="label">Total que saiu</span>
<b class="red" id="tout">R$ 0,00</b>
</div>
</div>

<section class="card today">
<div class="row">
<b>Movimentação de hoje</b>
<span class="label" id="date"></span>
</div>

<div class="grid">
<div>
<span class="label">Entrou</span>
<b class="green" id="hin">R$ 0,00</b>
</div>

<div>
<span class="label">Saiu</span>
<b class="red" id="hout">R$ 0,00</b>
</div>
</div>

<div class="row">
<span class="label">Saldo do dia</span>
<b id="hsaldo">R$ 0,00</b>
</div>
</section>

<div class="actions">
<button onclick="openForm('in')">+ Adicionar entrada</button>
<button class="exp" onclick="openForm('out')">− Adicionar gasto</button>
</div>

<div class="card form" id="form">
<b id="ft">Novo lançamento</b>

<input id="desc" placeholder="Descrição">
<input id="value" inputmode="decimal" placeholder="Valor (R$)">
<input id="d" type="date">

<select id="cat">
<option>Uber</option>
<option>Consultoria</option>
<option>C+A</option>
<option>Combustível</option>
<option>Alimentação</option>
<option>Manutenção</option>
<option>Contas</option>
<option>Compras</option>
<option>Produtos</option>
<option>Outros</option>
</select>

<button class="save" onclick="saveTx()">Salvar lançamento</button>
</div>

<h3>Histórico</h3>
<div id="history"></div>

</main>

<script>
const SUP='https://dpjrlnwppojxhtbrymgc.supabase.co/rest/v1/finance_transactions';
const KEY='sb_publishable_mwSu8ulI6M3ucvvGZY96eA_--7RuVPy';
const LK='meu-financeiro-v1';

let items=[];
let type='in';
let editId=null;

try{
  items=JSON.parse(localStorage.getItem(LK)||'[]');
  if(!Array.isArray(items))items=[];
}catch(e){
  items=[];
}

const brl=n=>Number(n||0).toLocaleString('pt-BR',{
  style:'currency',
  currency:'BRL'
});

const today=()=>new Date().toLocaleDateString('en-CA');

const headers={
  'apikey':KEY,
  'Content-Type':'application/json'
};

async function cloudGet(){
  const r=await fetch(
    SUP+'?select=*&order=tx_date.desc,updated_at.desc',
    {
      headers,
      cache:'no-store'
    }
  );

  if(!r.ok)throw new Error('cloud_get');

  const a=await r.json();

  return a.map(x=>({
    id:x.id,
    type:x.type,
    desc:x.description,
    value:Number(x.value),
    date:x.tx_date,
    cat:x.category,
    time:x.tx_time
  }));
}

async function sendRows(rows){
  if(!rows.length)return;

  const data=rows.map(x=>({
    id:String(x.id),
    type:x.type,
    description:x.desc,
    value:Number(x.value),
    tx_date:x.date,
    category:x.cat||'Outros',
    tx_time:x.time||'',
    updated_at:new Date().toISOString()
  }));

  const r=await Promise.race([fetch(
    SUP+'?on_conflict=id',
    {
      method:'POST',
      headers:{
        ...headers,
        'Prefer':'resolution=merge-duplicates,return=minimal'
      },
      body:JSON.stringify(data)
    }
  ),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout_post')),8000))]);

  if(!r.ok)throw new Error('cloud_put_'+r.status);
}

async function syncNow(){
  const el=document.getElementById('sync');

  try{
    const remote=await Promise.race([cloudGet(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))]);

    items=remote;

    localStorage.setItem(
      LK,
      JSON.stringify(items)
    );

    render();

    el.textContent='Sincronizado na nuvem';

  }catch(e){
    el.textContent='Sincronização pendente';
  }
}

async function persist(x){
  localStorage.setItem(
    LK,
    JSON.stringify(items)
  );

  render();

  const el=document.getElementById('sync');
  el.textContent='Sincronizando…';

  try{
    await sendRows([x]);
    await syncNow();

  }catch(e){
    el.textContent='Salvo neste aparelho • sincronização pendente';
  }
}

function openForm(t,id){
  type=t;
  editId=id||null;

  form.classList.add('on');
  d.value=today();

  if(id){
    const x=items.find(
      y=>String(y.id)===String(id)
    );

    if(x){
      desc.value=x.desc;
      value.value=x.value;
      d.value=x.date;
      cat.value=x.cat;
      type=x.type;
      ft.textContent='Editar lançamento';
    }

  }else{
    desc.value='';
    value.value='';
    ft.textContent=
      t==='in'
      ?'Nova entrada'
      :'Novo gasto';
  }

  form.scrollIntoView({
    behavior:'smooth',
    block:'center'
  });
}

function saveTx(){
  const v=parseFloat(
    value.value.replace(',','.')
  );

  if(!desc.value.trim()||!v){
    return alert(
      'Preencha a descrição e o valor.'
    );
  }

  let x;

  if(editId){

    x=items.find(
      y=>String(y.id)===String(editId)
    );

    Object.assign(x,{
      desc:desc.value.trim(),
      value:v,
      date:d.value,
      cat:cat.value,
      type
    });

  }else{

    x={
      id:Date.now(),
      desc:desc.value.trim(),
      value:v,
      date:d.value||today(),
      cat:cat.value,
      type,
      time:new Date().toLocaleTimeString(
        'pt-BR',
        {
          hour:'2-digit',
          minute:'2-digit'
        }
      )
    };

    items.push(x);
  }

  form.classList.remove('on');
  editId=null;

  persist(x);
}

let pendingDelete=null;
async function del(id){
  if(String(pendingDelete)!==String(id)){
    pendingDelete=id;
    render();
    setTimeout(()=>{if(String(pendingDelete)===String(id)){pendingDelete=null;render();}},3500);
    return;
  }
  pendingDelete=null;
  const old=items.slice();
  items=items.filter(x=>String(x.id)!==String(id));
  localStorage.setItem(LK,JSON.stringify(items));
  render();
  try{
    const r=await fetch(SUP+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers});
    if(!r.ok)throw new Error('delete');
    await syncNow();
  }catch(e){
    items=old;
    localStorage.setItem(LK,JSON.stringify(items));
    render();
    document.getElementById('sync').textContent='Sincronização pendente';
  }
}

function esc(s){
  return String(s||'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function render(){

  const a=items
    .filter(x=>x.type==='in')
    .reduce(
      (s,x)=>s+Number(x.value),
      0
    );

  const b=items
    .filter(x=>x.type==='out')
    .reduce(
      (s,x)=>s+Number(x.value),
      0
    );

  saldo.textContent=brl(a-b);

  saldo.className=
    'balance '+(a-b<0?'red':'green');

  tin.textContent=brl(a);
  tout.textContent=brl(b);

  const td=today();

  const i=items
    .filter(
      x=>x.date===td&&x.type==='in'
    )
    .reduce(
      (s,x)=>s+Number(x.value),
      0
    );

  const o=items
    .filter(
      x=>x.date===td&&x.type==='out'
    )
    .reduce(
      (s,x)=>s+Number(x.value),
      0
    );

  hin.textContent=brl(i);
  hout.textContent=brl(o);
  hsaldo.textContent=brl(i-o);

  date.textContent=new Date().toLocaleDateString('pt-BR');
  try{
    if(window.AndroidWidget&&window.AndroidWidget.update){
      const recent=items.slice().sort((x,y)=>(y.date||'').localeCompare(x.date||'')||Number(y.id)-Number(x.id)).slice(0,5).map(x=>(x.type==='in'?'↓ ':'↑ ')+x.desc+'   '+(x.type==='in'?'+ ':'− ')+brl(x.value)+'\n'+(x.date===td?'Hoje':x.date.split('-').reverse().join('/'))+' • '+(x.time||'')).join('\n');
      window.AndroidWidget.update(brl(a-b),brl(i),brl(o),recent||'Nenhum lançamento ainda.');
    }
  }catch(e){}

  const g={};

  items
    .slice()
    .sort(
      (a,b)=>
        (b.date||'').localeCompare(a.date||'')
        ||Number(b.id)-Number(a.id)
    )
    .forEach(
      x=>(g[x.date]??=[]).push(x)
    );

  document.getElementById('history').innerHTML=
    Object.keys(g).length
      ?''
      :'<div class="empty">Nenhum lançamento ainda.</div>';

  for(const [day,arr] of Object.entries(g)){

    const e=document.createElement('section');

    e.className='day';

    const inn=arr
      .filter(x=>x.type==='in')
      .reduce(
        (s,x)=>s+Number(x.value),
        0
      );

    const out=arr
      .filter(x=>x.type==='out')
      .reduce(
        (s,x)=>s+Number(x.value),
        0
      );

    e.innerHTML=
      '<div class="row"><b>'+
      day.split('-').reverse().join('/')+
      '</b><small class="label">'+
      brl(inn-out)+
      '</small></div>'+
      arr.map(x=>
        '<div class="tx">'+
          '<div>'+
            '<b>'+esc(x.desc)+'</b>'+
            '<small>'+
              esc(x.cat||'Outros')+
              ' • '+
              esc(x.time||'')+
            '</small>'+
          '</div>'+
          '<div>'+
            '<b class="'+
              (x.type==='in'?'green':'red')+
            '">'+
              (x.type==='in'?'+ ':'− ')+
              brl(x.value)+
            '</b>'+
            '<div>'+
              '<button onclick="openForm(\''+
                x.type+
                '\',\''+
                x.id+
              '\')">Editar</button>'+
              '<button onclick="del(\''+x.id+'\')" class="'+(String(pendingDelete)===String(x.id)?'danger':'')+'">'+(String(pendingDelete)===String(x.id)?'Confirmar':'Excluir')+'</button>'+
            '</div>'+
          '</div>'+
        '</div>'
      ).join('');

    document.getElementById('history').appendChild(e);
  }
}

render();

/*
  Na primeira abertura:
  1. lê os dados que já existem no aparelho;
  2. consulta o Supabase;
  3. envia somente lançamentos locais que ainda
     não existem na nuvem;
  4. depois passa a usar a nuvem como fonte central.
*/

async function widgetQuickSave(){
 const p=new URLSearchParams(location.search);
 if(p.get('widgetSave')!=='1')return false;
 try{
  const row={id:String(Date.now()),type:p.get('type')==='out'?'out':'in',description:p.get('desc')||'Lançamento',value:Number((p.get('value')||'0').replace(',','.')),tx_date:today(),category:p.get('cat')||'Outros',tx_time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
  const r=await fetch(SUP,{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify(row)});
  if(!r.ok)throw new Error('save');
  location.href='widget-saved://done';
 }catch(e){document.body.innerHTML='<div style="color:white;padding:24px">Erro ao salvar. Tente novamente.</div>';}
 return true;
}

async function boot(){

  const el=document.getElementById('sync');
  el.textContent='Iniciando sync v4…';

  try{

    const local=items.slice();

    let remote=await cloudGet();

    const remoteIds=new Set(
      remote.map(x=>String(x.id))
    );

    const missing=local.filter(
      x=>!remoteIds.has(String(x.id))
    );

    if(missing.length){

      el.textContent=
        'Enviando lançamentos pendentes…';

      await sendRows(missing);

      remote=await cloudGet();
    }

    items=remote;

    localStorage.setItem(
      LK,
      JSON.stringify(items)
    );

    render();

    el.textContent='Sincronizado na nuvem';

  }catch(e){

    el.textContent='Erro de sincronização: '+(e.message||e);
  }
}

widgetQuickSave().then(widgetMode=>{if(!widgetMode)boot();});

/*
  Mantém celular e tablet atualizados.
*/
setInterval(syncNow,5000);

</script>
</body>
</html>
