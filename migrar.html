<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sincronizar Meu Financeiro</title><style>body{margin:0;background:#050706;color:#eee;font-family:system-ui;padding:28px}.box{max-width:520px;margin:60px auto;padding:28px;border:1px solid #263028;border-radius:24px;background:#0b0e0c}h1{font-size:28px}.v{font-size:42px;color:#42f56c;font-weight:800}.s{color:#9ba39d}button{width:100%;padding:18px;border:0;border-radius:16px;background:#42f56c;font-size:18px;font-weight:800;margin-top:20px}</style><div class="box"><div class="s">MEU FINANCEIRO</div><h1>Migração segura</h1><div id="info">Verificando lançamentos deste aparelho…</div><button id="go" hidden>Enviar para a nuvem</button><p id="status" class="s"></p></div><script>
const SUP='https://dpjrlnwppojxhtbrymgc.supabase.co/rest/v1/finance_sync?id=eq.main',KEY='sb_publishable_mwSu8ulI6M3ucvvGZY96eA_--7RuVPy',LK='meu-financeiro-v1';
const H={'apikey':KEY,'Content-Type':'application/json'};
let items=[];try{items=JSON.parse(localStorage.getItem(LK)||'[]');if(!Array.isArray(items))items=[]}catch(e){}
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function show(){let en=items.filter(x=>x.type==='in').reduce((a,x)=>a+Number(x.value||0),0),out=items.filter(x=>x.type==='out').reduce((a,x)=>a+Number(x.value||0),0);info.innerHTML=items.length?'<div class="v">'+money(en-out)+'</div><p>'+items.length+' lançamento(s) encontrados neste aparelho.</p>':'<b>Nenhum lançamento encontrado neste aparelho.</b>';go.hidden=!items.length}
show();
go.onclick=async()=>{go.disabled=true;status.textContent='Enviando e conferindo…';try{let g=await fetch(SUP,{headers:H,cache:'no-store'});if(!g.ok)throw Error('GET '+g.status);let a=await g.json(),remote=a[0]?.payload||[],m=new Map(remote.map(x=>[String(x.id),x]));items.forEach(x=>m.set(String(x.id),x));let merged=[...m.values()];let p=await fetch(SUP,{method:'PATCH',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify({payload:merged,updated_at:new Date().toISOString()})});if(!p.ok)throw Error('PATCH '+p.status);let c=await fetch(SUP,{headers:H,cache:'no-store'}),z=await c.json(),saved=z[0]?.payload||[];if(saved.length<items.length)throw Error('verificação');status.innerHTML='<b style="color:#42f56c">Migração concluída e confirmada na nuvem.</b><br>Agora pode abrir o Meu Financeiro no tablet.';go.hidden=true}catch(e){status.textContent='Não foi possível enviar: '+e.message;go.disabled=false}}
</script></html>
