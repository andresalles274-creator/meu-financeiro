plugins { id 'com.android.application' }
android {
 namespace 'br.com.andre22bodybuilder.blackpharma'
 compileSdk 35
 defaultConfig { applicationId 'br.com.andre22bodybuilder.blackpharma'; minSdk 24; targetSdk 35; versionCode 4; versionName '2.1.1' }
 signingConfigs {
  release {
   storeFile file(System.getenv('BP_KEYSTORE_PATH') ?: 'black-pharma-release.jks')
   storePassword System.getenv('BP_STORE_PASSWORD') ?: ''
   keyAlias 'blackpharma'
   keyPassword System.getenv('BP_KEY_PASSWORD') ?: ''
  }
 }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
